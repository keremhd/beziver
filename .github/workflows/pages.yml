name: pages

# The bundle is generated, so it is not in the repo (.gitignore). It is built
# here instead and the built public/ is what gets served -- which also means a
# deploy cannot ship a stale script.js against a newer index.html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build     # app.test.js loads the BUNDLE, so build first
      - run: npm test          # 4 suites, no browser needed; gates the deploy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
